# FREE-TIER blueprint. Costs $0 on Render.
#
# ── What changed vs. the full deployment (render.paid.yaml) ─────────────────
#
# Render's free plan has NO background workers and NO cron jobs. There is
# therefore nowhere to run the Celery worker or Celery Beat, so this blueprint
# omits both. The pipeline instead runs in GitHub Actions on a cron schedule —
# see .github/workflows/publish.yml. Same agents, same order, same output; the
# only thing missing is the queue, which a one-shot process does not need.
#
#   autoblog-frontend  static site  free   React SPA
#   autoblog-api       web          free   FastAPI (read-only in practice)
#   autoblog-db        postgres     free   ⚠ EXPIRES AFTER 30 DAYS
#   autoblog-redis     key value    free   25 MB — cache + rate limits
#   [pipeline]         GitHub Actions      09:00 / 18:00 IST
#
# ── Free-tier limits you will actually notice ───────────────────────────────
#
# 1. The API spins down after ~15 min idle. The first request afterwards takes
#    ~50 s to wake. The frontend shows a loading state, then works normally.
# 2. Render's free Postgres is DELETED after 30 days. Before then either
#    upgrade it (~$6/mo) or move to Neon's free tier, which does not expire
#    and also supports pgvector — see docs/DEPLOY.md.
# 3. Triggering a run from the dashboard UI will NOT work: POST /runs enqueues
#    to Celery, and there is no worker consuming that queue. Trigger from the
#    GitHub Actions tab instead (Publish → Run workflow).
#
# To move to the always-on deployment later: rename render.paid.yaml to
# render.yaml, push, and re-apply the blueprint.

services:
  # ------------------------------------------------------------- frontend
  - type: web
    name: autoblog-frontend
    runtime: static
    # NO `plan` key here. Static sites have no instance type — they are always
    # free, and Render rejects the blueprint if you specify one:
    #   "no such plan free for service type web"
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: autoblog-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ------------------------------------------------------------------ API
  # Serves the reader UI's data. Migrations are applied by the GitHub Actions
  # workflow, not here — `preDeployCommand` requires a paid instance type.
  - type: web
    name: autoblog-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    dockerCommand: >
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    envVars:
      - key: ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO

      - key: DATABASE_URL
        fromDatabase:
          name: autoblog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: autoblog-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true

      # Set in the dashboard. The API itself only needs these for the
      # /preview endpoint; the pipeline runs in GitHub Actions.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # Render appends a random suffix when a service name is taken
      # (autoblog-frontend -> autoblog-frontend-a1b2.onrender.com), so the
      # exact origin is unknowable here. The regex matches the real host
      # whatever the suffix, while staying narrow enough that unrelated
      # Render sites are still rejected.
      - key: CORS_ORIGINS
        value: https://autoblog-frontend.onrender.com
      - key: CORS_ORIGIN_REGEX
        value: '^https://autoblog-frontend[a-z0-9-]*\.onrender\.com$'

      - key: MODEL_PROVIDER
        value: claude
      - key: VECTOR_BACKEND
        value: pgvector
      - key: TIMEZONE
        value: Asia/Kolkata

      - key: PUBLISH_TARGETS
        value: markdown
      - key: PUBLISH_STATUS
        value: draft
      - key: HUMAN_REVIEW
        value: "true"
      - key: DAILY_COST_LIMIT_USD
        value: "5"
      - key: IMAGE_PROVIDER
        value: none

  # ---------------------------------------------------------------- redis
  # If the blueprint is rejected on this block, your account uses the newer
  # naming: change `type: redis` to `type: keyvalue` here and in the
  # fromService reference above.
  - type: redis
    name: autoblog-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: autoblog-db
    databaseName: autoblog
    user: autoblog
    plan: free
    postgresMajorVersion: "16"
    # ⚠ Free Postgres is deleted 30 days after creation. Diarise it.
    # The GitHub Actions workflow needs the EXTERNAL connection string —
    # copy it from the dashboard into the DATABASE_URL repo secret.
