global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: autoblog

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: autoblog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
