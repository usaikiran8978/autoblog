worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    log_format json escape=json '{"time":"$time_iso8601","method":"$request_method",'
        '"path":"$uri","status":$status,"rt":$request_time,'
        '"ua":"$http_user_agent","ip":"$remote_addr"}';
    access_log /var/log/nginx/access.log json;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # Two zones: the pipeline trigger is expensive and gets a tight bucket;
    # read endpoints get a normal one.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=trigger:10m rate=6r/m;

    upstream api_backend {
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        client_max_body_size 20m;

        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Generated hero images. Immutable filenames => cache forever.
        location /media/ {
            alias /data/images/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /api/v1/runs {
            limit_req zone=trigger burst=3 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params_inline;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # A pipeline trigger returns in ms, but /preview on a long post
            # and slow upstreams justify a generous read timeout.
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Metrics must never be publicly reachable.
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://api_backend;
        }

        location /health {
            proxy_pass http://api_backend/api/v1/health;
            access_log off;
        }
    }
}
