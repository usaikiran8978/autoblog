# Full local stack: API + worker + beat + Postgres/pgvector + Redis + monitoring.
#   make up      → start everything
#   make migrate → apply schema
#   make seed    → load the source registry
#   make run     → trigger one pipeline immediately

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: [.env]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  volumes:
    - media:/data
  restart: unless-stopped
  networks: [autoblog]

services:
  # ------------------------------------------------------------ datastores
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoblog}
      POSTGRES_DB: ${POSTGRES_DB:-autoblog}
      # Postgres defaults are tuned for 1990s hardware; these are sane for a
      # 2-4 GB container.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_connections=120
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoblog} -d ${POSTGRES_DB:-autoblog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [autoblog]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [autoblog]
    restart: unless-stopped

  # ------------------------------------------------------------ application
  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers
    ports: ["8000:8000"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_HOST:-localhost}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  worker:
    <<: *app
    # Two queues, but concurrency 2: pipeline tasks are I/O-bound on LLM calls,
    # and more parallel writer calls mostly buys rate-limit errors.
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info --concurrency=2
      --queues=pipeline,maintenance
      --max-tasks-per-child=50
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  beat:
    <<: *app
    # Exactly one beat process, ever. Two beats = two editions per slot.
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
      --schedule=/data/celerybeat-schedule
    deploy:
      replicas: 1

  flower:
    <<: *app
    command: celery -A app.workers.celery_app flower --port=5555
    ports: ["5555:5555"]
    profiles: [monitoring]

  # ------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports: ["9090:9090"]
    networks: [autoblog]
    profiles: [monitoring]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]
    networks: [autoblog]
    profiles: [monitoring]

  # ---------------------------------------------------------------- ingress
  traefik:
    image: traefik:v3.2
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [autoblog]
    profiles: [production]

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/data:ro
    ports: ["8080:80"]
    depends_on: [api]
    networks: [autoblog]
    profiles: [production]

volumes:
  pgdata:
  redisdata:
  media:
  promdata:
  grafanadata:
  letsencrypt:

networks:
  autoblog:
    driver: bridge
